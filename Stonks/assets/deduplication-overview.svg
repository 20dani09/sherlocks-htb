<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 360" role="img" aria-labelledby="title desc">
<title id="title">How Windows Data Deduplication stores an optimized file</title>
<desc id="desc">Three files share chunks A and B. A deduplicated file is represented by an NTFS reparse point that maps to chunks in the ChunkStore. If the file is deleted, the reparse metadata may remain in the MFT, and chunks may survive.</desc>
<defs>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#64748b" stroke-width="1.6"/></marker>
  <style>
    .background{fill:#0b1220} .panel{fill:#121d30;stroke:#334155;stroke-width:1.4}
    .heading{fill:#f8fafc;font-family:Arial,sans-serif;font-size:19px;font-weight:bold}
    .body{fill:#cbd5e1;font-family:Arial,sans-serif;font-size:14px}
    .caption{fill:#94a3b8;font-family:Arial,sans-serif;font-size:12px}
    .chip{fill:#fff;font-family:Arial,sans-serif;font-size:15px;font-weight:bold;text-anchor:middle;dominant-baseline:middle}
    .a{fill:#2563eb}.b{fill:#0d9488}.c{fill:#9b59b6}.d{fill:#d97706}.e{fill:#be185d}
    .arrow{stroke:#64748b;stroke-width:2;fill:none;marker-end:url(#arrow)}
  </style>
</defs>
<rect width="1050" height="360" rx="18" class="background"/>
<text x="36" y="38" class="heading">Windows Data Deduplication · Conceptual overview</text>
<text x="36" y="60" class="caption">Files share repeated byte ranges without duplicating their physical payloads.</text>

<rect class="panel" x="30" y="83" width="276" height="220" rx="14"/>
<text class="heading" x="52" y="111">Logical files</text>
<text class="body" x="52" y="139">Report A</text>
<rect class="a" x="157" y="121" width="34" height="26" rx="4"/><text class="chip" x="174" y="134">A</text>
<rect class="b" x="195" y="121" width="34" height="26" rx="4"/><text class="chip" x="212" y="134">B</text>
<rect class="c" x="233" y="121" width="34" height="26" rx="4"/><text class="chip" x="250" y="134">C</text>
<text class="body" x="52" y="185">Report B</text>
<rect class="a" x="157" y="167" width="34" height="26" rx="4"/><text class="chip" x="174" y="180">A</text>
<rect class="b" x="195" y="167" width="34" height="26" rx="4"/><text class="chip" x="212" y="180">B</text>
<rect class="d" x="233" y="167" width="34" height="26" rx="4"/><text class="chip" x="250" y="180">D</text>
<text class="body" x="52" y="231">Report C</text>
<rect class="a" x="157" y="213" width="34" height="26" rx="4"/><text class="chip" x="174" y="226">A</text>
<rect class="b" x="195" y="213" width="34" height="26" rx="4"/><text class="chip" x="212" y="226">B</text>
<rect class="e" x="233" y="213" width="34" height="26" rx="4"/><text class="chip" x="250" y="226">E</text>
<text class="caption" x="52" y="279">A and B repeat across files.</text>

<path class="arrow" d="M317 190 H375"/>
<rect class="panel" x="385" y="83" width="276" height="220" rx="14"/>
<text class="heading" x="407" y="111">NTFS reparse points</text>
<text class="body" x="407" y="142">Report A → A, B, C</text>
<text class="body" x="407" y="174">Report B → A, B, D</text>
<text class="body" x="407" y="206">Report C → A, B, E</text>
<text class="caption" x="407" y="247">Each mapping references shared</text>
<text class="caption" x="407" y="265">chunks, not duplicate bytes.</text>

<path class="arrow" d="M672 190 H730"/>
<rect class="panel" x="740" y="83" width="280" height="220" rx="14"/>
<text class="heading" x="762" y="111">ChunkStore</text>
<rect class="a" x="764" y="142" width="38" height="40" rx="5"/><text class="chip" x="783" y="162">A</text>
<rect class="b" x="807" y="142" width="38" height="40" rx="5"/><text class="chip" x="826" y="162">B</text>
<rect class="c" x="850" y="142" width="38" height="40" rx="5"/><text class="chip" x="869" y="162">C</text>
<rect class="d" x="893" y="142" width="38" height="40" rx="5"/><text class="chip" x="912" y="162">D</text>
<rect class="e" x="936" y="142" width="38" height="40" rx="5"/><text class="chip" x="955" y="162">E</text>
<text class="body" x="762" y="213">One copy per unique chunk</text>
<text class="caption" x="762" y="246">ChunkStore data is separate</text>
<text class="caption" x="762" y="264">from the logical file entry.</text>

<text class="caption" x="33" y="329">Forensic consequence: deleting a file does not necessarily overwrite its chunks immediately.</text>
</svg>